name: Build CanvasProject release

# Compila o CanvasProject (pintura digital do Project Club, base Krita)
# para Linux e Windows usando as MESMAS dependências pré-compiladas e
# scripts do CI oficial do Krita (krita-deps-management / krita-ci-utilities,
# pacotes públicos do invent.kde.org), e publica:
#   - Linux:   CanvasProject.AppImage
#   - Windows: CanvasProject-<versão>-win.zip (bin/krita.exe → CanvasProject.exe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      publish:
        description: 'Publicar a release'
        type: boolean
        default: true

env:
  KDECI_BUILD_TYPE: Release
  KDECI_GITLAB_SERVER: https://invent.kde.org/
  KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: 'False'
  KDECI_EXTRA_CMAKE_ARGS: -DHIDE_SAFE_ASSERTS=ON -DBUILD_TESTING=OFF -DENABLE_UPDATERS=OFF
  KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE: 'True'
  KRITACI_SKIP_DEBUG_PACKAGE: 'True'
  KRITACI_BUILD_INSTALLERS: 'False'
  KDECI_SIGN_BINARIES: 'False'

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KDECI_CC_CACHE: ${{ github.workspace }}/_cache/cc
      KDECI_CACHE_PATH: ${{ github.workspace }}/_cache/artifacts
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-appimage
      KDECI_REPO_METADATA_PATH: ${{ github.workspace }}/krita-deps-management/repo-metadata
    steps:
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Ferramentas do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build ccache cmake gettext python3-venv patchelf file \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libxi-dev libxrender-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxcb1-dev libxcb-*-dev libdbus-1-dev libasound2-dev \
            libpulse-dev libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libfuse2 desktop-file-utils appstream
      - name: Scripts e dependências do CI do Krita
        run: |
          git clone https://invent.kde.org/packaging/krita-deps-management.git -b master --depth=1
          git clone https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities --depth=1
          python3 -m venv venv --upgrade-deps
          . venv/bin/activate
          pip install -r krita-deps-management/requirements.txt
          python3 -u krita-deps-management/tools/replace-branch-in-seed-file.py krita-deps-management/latest/krita-deps.yml -p -o branch-corrected-deps.yml -d master
          python3 -u krita-deps-management/tools/generate-deps-file.py -s branch-corrected-deps.yml -o .kde-ci.yml
      - name: Compilar
        run: |
          . venv/bin/activate
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -u krita-deps-management/ci-utilities/run-ci-build.py --project krita --branch master --platform Linux/Qt5/Shared --skip-publishing
      - name: AppImage
        run: |
          . venv/bin/activate
          python3 -u build-tools/ci-scripts/build-appimage.py
          APP=$(ls _packaging/*.appimage _packaging/*.AppImage 2>/dev/null | head -1)
          test -n "$APP" || { ls -la _packaging || true; exit 1; }
          mkdir -p dist && cp "$APP" dist/CanvasProject.AppImage && chmod +x dist/CanvasProject.AppImage
          du -h dist/CanvasProject.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: canvasproject-linux
          path: dist/CanvasProject.AppImage

  screenshots:
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: canvasproject-linux
          path: app
      - name: Dependências para rodar e capturar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick openbox libgl1 libegl1 libfuse2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 fonts-noto-core
      - name: Rodar o CanvasProject e capturar telas
        run: |
          mkdir -p shots
          rc=0
          bash .github/scripts/screenshots.sh app/CanvasProject.AppImage shots > shots/run.log 2>&1 || rc=$?
          cat shots/run.log
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvasproject-screenshots
          path: shots/
      - name: Guardar capturas no ramo 'capturas'
        if: always()
        run: |
          cd shots
          git init -q -b capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de tela ${{ inputs.version }} (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      KDECI_CC_CACHE: C:\_kci\cc
      KDECI_CACHE_PATH: C:\_kci\artifacts
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-windows
      KDECI_REPO_METADATA_PATH: ${{ github.workspace }}\krita-deps-management\repo-metadata
      KDECI_EXTRA_CMAKE_ARGS: -DHIDE_SAFE_ASSERTS=ON -DBUILD_TESTING=OFF -DENABLE_UPDATERS=OFF -DBUILD_WITH_QT6=ON -DALLOW_UNSTABLE=QT6
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compilador llvm-mingw (o mesmo tipo usado pelo Krita)
        shell: pwsh
        run: |
          # Mesma série do compilador usado pelo CI do Krita (clang 21): as
          # dependências prontas do KDE (Qt, KF6...) foram compiladas com ela.
          $headers = @{ Authorization = "Bearer ${{ github.token }}" }
          $rels = Invoke-RestMethod -Headers $headers 'https://api.github.com/repos/mstorsjo/llvm-mingw/releases?per_page=100'
          $rel = $rels | Where-Object { -not $_.prerelease -and $_.name -match 'LLVM 21\.' } | Select-Object -First 1
          if (-not $rel) { throw 'Não encontrei um llvm-mingw com LLVM 21' }
          Write-Host "Usando $($rel.name)"
          $asset = $rel.assets | Where-Object { $_.name -like '*-ucrt-x86_64.zip' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile llvm.zip
          Expand-Archive llvm.zip -DestinationPath C:\
          $dir = (Get-ChildItem C:\ -Directory -Filter 'llvm-mingw-*' | Select-Object -First 1).FullName
          "$dir\bin" | Out-File -Append $env:GITHUB_PATH -Encoding utf8
          choco install -y ninja ccache
      - name: Scripts e dependências do CI do Krita
        shell: pwsh
        run: |
          git clone https://invent.kde.org/packaging/krita-deps-management.git -b transition.now/qt6 --depth=1
          git clone https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities --depth=1
          python -m venv venv
          . venv\Scripts\Activate.ps1
          pip install -r krita-deps-management/requirements.txt
          pip install -r krita-deps-management/ci-utilities/requirements-windows.txt
          python -u krita-deps-management/tools/replace-branch-in-seed-file.py krita-deps-management/latest/krita-deps.yml -p -o branch-corrected-deps.yml -d transition.now/qt6
          python -u krita-deps-management/tools/generate-deps-file.py -s branch-corrected-deps.yml -o .kde-ci.yml
      - name: Compilar
        shell: pwsh
        run: |
          . venv\Scripts\Activate.ps1
          git config --global --add safe.directory $env:GITHUB_WORKSPACE
          python -u krita-deps-management/ci-utilities/run-ci-build.py --project krita --branch master --platform Windows/Qt6/Shared --skip-publishing
      - name: Pacote
        shell: pwsh
        run: |
          . venv\Scripts\Activate.ps1
          python -u build-tools/ci-scripts/build-windows-package.py
          $exe = Get-ChildItem -Path . -Recurse -Filter krita.exe | Where-Object { $_.FullName -notmatch '_build' } | Select-Object -First 1
          if (-not $exe) { throw "krita.exe não encontrado" }
          $root = Split-Path $exe.DirectoryName -Parent
          Copy-Item $exe.FullName (Join-Path $exe.DirectoryName 'CanvasProject.exe')
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$root\*" -DestinationPath "dist\CanvasProject-${{ inputs.version }}-win.zip"
          Get-Item dist\*.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: canvasproject-windows
          path: dist/*.zip

  release:
    if: ${{ inputs.publish }}
    needs: [linux, windows, screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: CanvasProject ${{ inputs.version }}
          body: |
            CanvasProject ${{ inputs.version }} — pintura digital do Project Club (baseado no Krita, GNU GPL v3).
            - Windows: CanvasProject-${{ inputs.version }}-win.zip
            - Linux: CanvasProject.AppImage
            Instale e atualize pela aba **Apps** do Project Club.
          files: |
            dist/canvasproject-linux/CanvasProject.AppImage
            dist/canvasproject-windows/*.zip
            dist/canvasproject-screenshots/*.png
