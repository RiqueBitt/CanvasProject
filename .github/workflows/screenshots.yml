name: Capturas de tela (CanvasProject)

# Roda só as capturas de tela, usando o CanvasProject.AppImage de uma compilação
# anterior (run_id do "Build CanvasProject release"). Útil para refazer as capturas
# sem recompilar. As imagens vão para o ramo 'capturas'.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID da execução do "Build CanvasProject release" que tem o AppImage'
        required: true
      version:
        description: 'Versão (só para a mensagem do commit)'
        default: '1.0.0'

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: canvasproject-linux
          path: app
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Dependências para rodar e capturar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick openbox libgl1 libegl1 libfuse2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 fonts-noto-core
      - name: Rodar o CanvasProject e capturar telas
        run: |
          mkdir -p shots
          bash .github/scripts/screenshots.sh app/CanvasProject.AppImage shots 2>&1 | tee shots/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvasproject-screenshots
          path: shots/
      - name: Guardar capturas no ramo 'capturas'
        if: always()
        run: |
          cd shots
          git init -q -b capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de tela ${{ inputs.version }} (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

